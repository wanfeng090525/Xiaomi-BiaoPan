org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
# 开启构建缓存：CI 上配合 setup-gradle 缓存，未变更模块的任务输出直接复用
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
