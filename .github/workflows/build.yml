# GitHub Actions 云一键构建:自动生成已签名的 Debug 与 Release 两个 APK
name: Build WatchfaceIdTool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug + Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      # AGP 8.13 + jvmTarget 21 要求 JDK 21
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 生成本地配置并接受 SDK 许可
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # 同时构建 Debug(自动签名)与 Release(使用源码 keystore/watchface.jks 自动签名)
      - name: 一键构建 Debug + 签名 Release (gradlew wrapper)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watchface-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: 上传 签名 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: watchface-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

      # 构建成功后自动把 APK 原文件发布到 GitHub Release
      - name: 自动发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: watchface-build-${{ github.run_number }}
          name: "小米时钟表盘自动构建 #${{ github.run_number }}"
          body: |
            本次构建由 GitHub Actions 自动生成。
            提交: `${{ github.sha }}`
            Debug 与签名 Release 安装包均已附上,直接下载对应 .apk 即可。
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}