# GitHub Actions 云一键构建:默认生成签名 Release APK；Debug 包与 R8 混淆均可按需选择
name: Build WatchfaceIdTool

on:
  workflow_dispatch:
    inputs:
      r8:
        description: "R8 混淆压缩（Release 包）：开启=体积更小更安全，关闭=构建更快"
        type: choice
        default: "开启"
        options:
          - "开启"
          - "关闭"
      debug:
        description: "构建 Debug 包：默认关闭，只出 Release"
        type: choice
        default: "关闭"
        options:
          - "关闭"
          - "开启"

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK（可选 Debug）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      # AGP 8.13 + jvmTarget 21 要求 JDK 21
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 缓存 Gradle Wrapper + 依赖 + 构建缓存：首次构建无收益，
      # 之后每次构建跳过依赖下载和未变更模块的重复编译，是提速关键
      - name: 缓存 Gradle（依赖 + 构建缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 生成本地配置并预置 SDK 许可
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 直接写入许可哈希文件，比 sdkmanager --licenses 快十几秒
          mkdir -p "$ANDROID_HOME/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c7c9a3522867b\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      # 微验 SDK：用 NDK 从 app/src/main/cpp 的源码编译 libwyverify.so
      # （Android.mk 构建前会自动跑 tools/gen_wy_constants.py 生成 RC4 加密常量头）
      # ubuntu-latest 已预装 NDK 27.x 且 ANDROID_NDK_HOME 直接指向它，
      # 命中就复用，省掉 nttld/setup-ndk 下载 NDK 的约 35s
      - name: 探测运行器自带 NDK 27.x
        id: probe
        run: |
          NDK="${ANDROID_NDK_HOME:-}"
          case "$NDK" in
            */ndk/27.*) ;;
            *) NDK="$(ls -d "$ANDROID_HOME"/ndk/27.* 2>/dev/null | sort -V | tail -1)" ;;
          esac
          if [ -n "$NDK" ] && [ -x "$NDK/ndk-build" ]; then
            echo "ndk-path=$NDK" >> "$GITHUB_OUTPUT"
            echo "复用运行器自带 NDK：$NDK"
          else
            echo "ndk-path=" >> "$GITHUB_OUTPUT"
            echo "运行器未自带 NDK 27.x，将回退下载安装"
          fi

      # 兜底：仅当运行器未自带 r27 时才下载（正常情况会被上一步命中而跳过）
      - name: 下载安装 Android NDK r27（兜底）
        if: steps.probe.outputs.ndk-path == ''
        id: setupndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: 编译微验 libwyverify.so（arm64-v8a）
        env:
          ANDROID_NDK_HOME: ${{ steps.probe.outputs.ndk-path || steps.setupndk.outputs.ndk-path }}
        run: |
          test -x "$ANDROID_NDK_HOME/ndk-build" || { echo "NDK 未就绪：$ANDROID_NDK_HOME"; exit 1; }
          python3 app/src/main/cpp/tools/gen_wy_constants.py
          cd app/src/main/cpp
          rm -rf libs obj
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk
          SO="$(find libs -name '*.so' | head -1)"
          test -n "$SO" && test -s "$SO" || { echo "!!! libwyverify.so 构建失败或为空 !!!"; exit 1; }
          mkdir -p ../jniLibs/arm64-v8a
          cp "$SO" ../jniLibs/arm64-v8a/libwyverify.so
          ls -lh ../jniLibs/arm64-v8a/libwyverify.so

      # 从 Secrets 还原签名密钥：仓库与 git 历史里都不再存放 .jks / 密码
      - name: 还原签名密钥（来自 Secrets）
        run: |
          mkdir -p app/keystore
          printf '%s' "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/watchface.jks

      # 组装 Gradle 任务与参数：
      # - Debug 包：默认不构建，输入选"开启"才追加 assembleDebug
      # - R8：默认开启混淆；选"关闭"透传 -Pr8=false，Release 跳过混淆压缩明显提速
      # - 不加 --no-daemon：保留守护进程省去 JVM 冷启动
      - name: 构建 APK（gradlew wrapper，按所选选项执行）
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          TASKS="assembleRelease"
          if [ "${{ github.event.inputs.debug }}" = "开启" ]; then
            TASKS="assembleDebug $TASKS"
          fi
          FLAGS=""
          if [ "${{ github.event.inputs.r8 }}" = "关闭" ]; then
            FLAGS="-Pr8=false"
          fi
          ./gradlew $TASKS $FLAGS

      - name: 上传 Debug APK
        if: github.event.inputs.debug == '开启'
        uses: actions/upload-artifact@v4
        with:
          name: watchface-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: 上传 签名 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: watchface-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

      # 构建成功后自动把 APK 原文件发布到 GitHub Release
      # Debug 包只在勾选"开启"时才生成；未生成时下面的 debug glob 匹配不到文件，
      # 动作会自动跳过（fail_on_unmatched_files 默认 false），不会导致发布失败
      - name: 自动发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: watchface-build-${{ github.run_number }}
          name: "小米时钟表盘自动构建 #${{ github.run_number }}"
          body: |
            本次构建由 GitHub Actions 自动生成。
            提交: `${{ github.sha }}`
            R8 混淆: ${{ github.event.inputs.r8 }} ｜ Debug 包: ${{ github.event.inputs.debug }}
            直接下载附带的 .apk 即可安装。
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
