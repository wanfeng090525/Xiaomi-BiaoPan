# GitHub Actions 云一键构建:自动生成已签名的 Debug 与 Release 两个 APK
name: Build WatchfaceIdTool

on:
  workflow_dispatch:
    inputs:
      r8:
        description: "R8 混淆压缩（仅 Release 包）：开启=体积更小更安全，关闭=构建更快"
        type: choice
        default: "开启"
        options:
          - "开启"
          - "关闭"

permissions:
  contents: write

jobs:
  build:
    name: Build Debug + Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      # AGP 8.13 + jvmTarget 21 要求 JDK 21
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 缓存 Gradle Wrapper + 依赖 + 构建缓存：首次构建无收益，
      # 之后每次构建跳过依赖下载和未变更模块的重复编译，是提速关键
      - name: 缓存 Gradle（依赖 + 构建缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 生成本地配置并接受 SDK 许可
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # 同时构建 Debug(自动签名)与 Release(使用源码 keystore/watchface.jks 自动签名)
      # 不加 --no-daemon：保留守护进程省去 JVM 冷启动
      # R8 开关由 workflow_dispatch 输入透传：关闭时 Release 跳过混淆压缩，明显提速
      - name: 一键构建 Debug + 签名 Release (gradlew wrapper)
        run: |
          if [ "${{ github.event.inputs.r8 }}" = "关闭" ]; then
            ./gradlew assembleDebug assembleRelease -Pr8=false
          else
            ./gradlew assembleDebug assembleRelease
          fi

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watchface-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: 上传 签名 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: watchface-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

      # 构建成功后自动把 APK 原文件发布到 GitHub Release
      - name: 自动发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: watchface-build-${{ github.run_number }}
          name: "小米时钟表盘自动构建 #${{ github.run_number }}"
          body: |
            本次构建由 GitHub Actions 自动生成。
            提交: `${{ github.sha }}`
            Debug 与签名 Release 安装包均已附上,直接下载对应 .apk 即可。
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}